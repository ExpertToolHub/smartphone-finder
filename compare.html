<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Devices - SmartFinder India</title>
  <link rel="stylesheet" href="smartphone-finder/css/base.css">
  <link rel="stylesheet" href="smartphone-finder/css/components.css">
  <style>
    .compare-page-wrap { max-width: 1200px; margin: 30px auto; padding: 0 16px; width: 100%; }
    .table-container { background: #ffffff; border-radius: 16px; border: 1px solid var(--border-light); overflow-x: auto; box-shadow: var(--shadow-card); }
    .comp-table { width: 100%; border-collapse: collapse; min-width: 650px; }
    .comp-table th, .comp-table td { padding: 14px 18px; border-bottom: 1px solid var(--border-light); text-align: left; }
    .comp-table th { background: #f8fafc; color: var(--text-muted); font-size: 0.84rem; font-weight: 700; width: 180px; text-transform: uppercase; letter-spacing: 0.5px; }
    .comp-table td { font-size: 0.9rem; color: var(--text-main); }
    .device-head { font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin-bottom: 4px; }
    .btn-del { color: var(--accent-rose); background: none; border: none; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
    .best-spec { color: #166534; font-weight: 700; background: #f0fdf4; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="brand-wrap">
      <a href="index.html" style="font-weight:700; color:var(--primary-indigo); font-size:0.95rem;">← Back to Explorer</a>
    </div>
    <button id="clearAllBtn" class="btn-compare" style="border-color:var(--accent-rose); color:var(--accent-rose);">Clear All</button>
  </nav>

  <div class="compare-page-wrap">
    <div id="emptyNotice" class="state-card" style="display:none;">
      <h3>No Phones Selected For Comparison</h3>
      <p style="margin-top:6px;">Go back to the explorer and tap "+ Compare" on up to 4 smartphones.</p>
      <a href="index.html" class="btn-compare-dock" style="display:inline-block; margin-top:16px;">Explore 3,000+ Phones</a>
    </div>

    <div class="table-container" id="compareContainer" style="display:none;">
      <table class="comp-table">
        <tbody id="compareTbody"></tbody>
      </table>
    </div>
  </div>

  <script src="smartphone-finder/js/utils.js"></script>
  <script src="smartphone-finder/js/data.js"></script>
  <script src="smartphone-finder/js/compare.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const phones = await DataModule.loadPhones();
      const ids = CompareModule.getCompareList();
      const selected = phones.filter(p => ids.includes(p.id));

      const emptyEl = document.getElementById('emptyNotice');
      const tableWrap = document.getElementById('compareContainer');
      const tbody = document.getElementById('compareTbody');

      if (!selected.length) {
        emptyEl.style.display = 'block';
        tableWrap.style.display = 'none';
        return;
      }

      emptyEl.style.display = 'none';
      tableWrap.style.display = 'block';

      const specsRows = [
        {
          label: 'Device',
          val: p => `
            <div class="device-head">${Utils.escapeHTML(p.brand)} ${Utils.escapeHTML(p.model)}</div>
            <button class="btn-del" onclick="removeSingle('${p.id}')">✕ Remove</button>
          `
        },
        { label: 'India Price', val: p => `<b style="font-size:1.1rem; color:var(--primary-indigo);">${Utils.formatINR(p.price?.inr)}</b>` },
        { label: 'Launch Year', val: p => `<b>${p.launchYear || 'N/A'}</b>` },
        { label: 'Processor', val: p => p.specs?.processor || 'N/A' },
        { label: 'RAM', val: p => Array.isArray(p.specs?.ram) ? p.specs.ram.join(', ') + ' GB' : (p.specs?.ram + ' GB') },
        { label: 'Storage', val: p => Array.isArray(p.specs?.storage) ? p.specs.storage.join(', ') + ' GB' : (p.specs?.storage + ' GB') },
        { label: 'Battery', val: p => p.specs?.battery ? `<b>${p.specs.battery} mAh</b>` : 'N/A' },
        { label: 'Display', val: p => `${p.specs?.display?.size || ''}" ${p.specs?.display?.refreshRate || ''}Hz ${p.specs?.display?.type || ''}` },
        { label: 'Main Camera', val: p => p.specs?.cameras?.main ? `<b>${p.specs.cameras.main} MP</b>` : 'N/A' },
        { label: 'Front Camera', val: p => p.specs?.cameras?.front ? `${p.specs.cameras.front} MP` : 'N/A' },
        { label: 'Gaming Score', val: p => `🎮 <b>${p.useCases?.gaming || 7}/10</b>` },
        { label: 'Camera Score', val: p => `📸 <b>${p.useCases?.camera || 7}/10</b>` },
        { label: 'Battery Score', val: p => `🔋 <b>${p.useCases?.battery || 7}/10</b>` },
        { label: 'Value Score', val: p => `💎 <b>${p.useCases?.value || 7}/10</b>` }
      ];

      tbody.innerHTML = specsRows.map(r => {
        return `<tr>
          <th>${r.label}</th>
          ${selected.map(p => `<td>${r.val(p)}</td>`).join('')}
        </tr>`;
      }).join('');

      window.removeSingle = (id) => {
        CompareModule.removeFromCompare(id);
        window.location.reload();
      };

      document.getElementById('clearAllBtn')?.addEventListener('click', () => {
        CompareModule.clear();
        window.location.reload();
      });
    });
  </script>
</body>
</html>
