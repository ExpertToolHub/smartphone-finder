<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartFinder India - Best Smartphone Finder 2026</title>
  <style>
    /* Global Variables & Colors */
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-purple: #7c3aed;
      --accent-rose: #f43f5e;
      --grad-brand: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #ec4899 100%);
      --grad-btn: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      --grad-gold: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      --grad-purple: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
      --shadow-card: 0 4px 18px rgba(15, 23, 42, 0.06);
      --shadow-hover: 0 12px 28px rgba(79, 70, 229, 0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-pill: 9999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }

    /* Sticky Navbar */
    .navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-wrap { display: flex; align-items: center; gap: 10px; }
    .brand-title {
      font-size: 1.4rem;
      font-weight: 900;
      background: var(--grad-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .brand-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: #ede9fe;
      color: var(--primary-purple);
      border: 1px solid #ddd6fe;
    }
    .btn-compare {
      background: #ffffff;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .btn-compare:hover { background: var(--primary); color: #ffffff; }

    /* Layout */
    .app-layout {
      display: flex;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      padding: 20px;
      gap: 24px;
    }

    /* Filter Sidebar */
    .filter-sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      height: fit-content;
      box-shadow: var(--shadow-card);
    }
    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h3 { font-size: 1.05rem; font-weight: 800; }
    .reset-link { font-size: 0.8rem; font-weight: 700; color: var(--accent-rose); background: none; border: none; cursor: pointer; }

    .filter-group-list { display: flex; flex-direction: column; gap: 16px; }
    .filter-label { display: block; font-size: 0.82rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
    .price-val { color: var(--primary); font-weight: 800; }
    .range-slider { width: 100%; accent-color: var(--primary); cursor: pointer; }
    .form-select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: #ffffff;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
    }

    /* Pills & Presets */
    .pill-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill-btn, .budget-preset-btn {
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill-btn:hover, .budget-preset-btn:hover { background: #ede9fe; color: var(--primary-purple); border-color: #ddd6fe; }
    .pill-btn.active, .budget-preset-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
    }

    /* Main Section */
    .main-content { flex: 1; min-width: 0; }
    .search-section {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 18px;
    }
    .search-bar-wrap { display: flex; gap: 10px; margin-bottom: 12px; }
    .search-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: #f8fafc;
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); background: #ffffff; }
    .mobile-filter-btn {
      display: none;
      padding: 0 16px;
      font-weight: 700;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: #ffffff;
      cursor: pointer;
    }

    /* Quick Top Bar */
    .quick-top-pills { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .quick-top-pills::-webkit-scrollbar { display: none; }
    .top-pill {
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .top-pill.active { background: var(--grad-btn); color: #ffffff; border-color: transparent; }
    .top-pill.highlight-gold.active { background: var(--grad-gold); color: #ffffff; border-color: transparent; }
    .top-pill.highlight-purple.active { background: var(--grad-purple); color: #ffffff; border-color: transparent; }

    /* Results Bar */
    .results-meta-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; font-size: 0.88rem; }
    .result-count { color: var(--text-muted); }
    .result-count b { color: var(--text-main); font-size: 1.05rem; }
    .sort-wrap { display: flex; align-items: center; gap: 8px; }
    .sort-select { padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #ffffff; font-weight: 700; outline: none; }

    /* Modern Phone Card Grid */
    .phone-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; }
    .phone-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-card);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .phone-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: #cbd5e1; }

    .card-top-tag-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .rank-badge { font-size: 0.74rem; font-weight: 800; padding: 3px 10px; border-radius: var(--radius-pill); background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .launch-pill { font-size: 0.76rem; font-weight: 800; color: var(--text-muted); }

    .brand-sub { font-size: 0.8rem; color: var(--primary); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .phone-title { font-size: 1.2rem; font-weight: 900; color: var(--text-main); margin-bottom: 6px; }
    .phone-price { font-size: 1.45rem; font-weight: 900; color: #1e1b4b; margin-bottom: 14px; }

    /* Multi-Color Spec Pills */
    .specs-pills-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
    .spec-chip { padding: 8px 10px; border-radius: var(--radius-md); font-size: 0.78rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .chip-soc { background: #fffbeb; color: #92400e; border: 1px solid #fef3c7; }
    .chip-battery { background: #f0fdf4; color: #166534; border: 1px solid #dcfce7; }
    .chip-ram { background: #faf5ff; color: #6b21a8; border: 1px solid #f3e8ff; }
    .chip-camera { background: #f0f9ff; color: #0369a1; border: 1px solid #e0f2fe; }

    /* Card Actions */
    .card-actions { display: flex; gap: 10px; margin-top: auto; }
    .btn-card-specs {
      flex: 1;
      padding: 10px;
      border-radius: var(--radius-md);
      background: var(--grad-btn);
      color: #ffffff;
      border: none;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-card-compare {
      padding: 10px 14px;
      border-radius: var(--radius-md);
      background: #f8fafc;
      color: var(--text-main);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-card-compare.active { background: #ede9fe; color: var(--primary-purple); border-color: #c4b5fd; }

    /* Compare Dock & Modal */
    .compare-dock {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 10px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      display: none;
      align-items: center;
      gap: 14px;
      z-index: 99;
    }
    .dock-text { font-size: 0.88rem; font-weight: 700; }
    .btn-compare-dock { background: var(--grad-brand); color: #ffffff; padding: 8px 18px; border-radius: var(--radius-pill); font-size: 0.82rem; font-weight: 800; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 200;
    }
    .modal-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      max-width: 550px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .modal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-name { font-size: 1.35rem; font-weight: 900; }
    .btn-close { background: #f1f5f9; border: none; padding: 6px 12px; border-radius: var(--radius-pill); cursor: pointer; font-weight: 800; }

    .state-card { background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 50px 20px; text-align: center; color: var(--text-muted); }
    .spinner { width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .app-layout { padding: 14px; }
      .filter-sidebar { display: none; }
      .filter-sidebar.open { display: block; position: fixed; inset: 0; width: 100%; z-index: 150; border-radius: 0; overflow-y: auto; }
      .mobile-filter-btn { display: block; }
    }
  </style>
</head>
<body>
  <!-- Clean Header -->
  <nav class="navbar">
    <div class="brand-wrap">
      <span class="brand-title">SmartFinder</span>
      <span class="brand-badge">India 2026 Edition</span>
    </div>
    <div>
      <a href="compare.html" id="navCompareBtn" class="btn-compare">Compare (<span id="compareCount">0</span>)</a>
    </div>
  </nav>

  <div class="app-layout">
    <!-- Filter Sidebar -->
    <aside class="filter-sidebar" id="filterSidebar">
      <div class="sidebar-header">
        <h3>Match Requirements</h3>
        <button id="resetFilters" class="reset-link">Reset All</button>
      </div>

      <div class="filter-group-list">
        <div class="filter-item">
          <label class="filter-label">Quick Budget</label>
          <div class="pill-group">
            <button class="budget-preset-btn" data-min="0" data-max="15000">&lt; ₹15k</button>
            <button class="budget-preset-btn" data-min="15000" data-max="25000">₹15k–₹25k</button>
            <button class="budget-preset-btn" data-min="25000" data-max="45000">₹25k–₹45k</button>
            <button class="budget-preset-btn" data-min="45000" data-max="180000">₹45k+ (Flagship)</button>
          </div>
        </div>

        <div class="filter-item">
          <label class="filter-label">Max Budget: <b id="priceLabel" class="price-val">₹1,80,000</b></label>
          <input type="range" id="priceRange" min="5000" max="180000" step="5000" value="180000" class="range-slider">
        </div>

        <div class="filter-item">
          <label class="filter-label">Brand</label>
          <select id="brandSelect" class="form-select">
            <option value="">All Brands (Any)</option>
          </select>
        </div>

        <div class="filter-item">
          <label class="filter-label">Processor Type</label>
          <select id="procSelect" class="form-select">
            <option value="">Any Processor</option>
            <option value="Snapdragon">Qualcomm Snapdragon</option>
            <option value="Dimensity">MediaTek Dimensity</option>
            <option value="Apple">Apple Bionic / Pro</option>
            <option value="Tensor">Google Tensor</option>
          </select>
        </div>

        <div class="filter-item">
          <label class="filter-label">Launch Year</label>
          <select id="yearSelect" class="form-select">
            <option value="">All Years (Up to 2026)</option>
            <option value="2026">2026 (Latest Launches)</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023 & older</option>
          </select>
        </div>

        <div class="filter-item">
          <label class="filter-label">Min RAM</label>
          <div class="pill-group" id="ramPills">
            <button class="pill-btn" data-val="6">6GB+</button>
            <button class="pill-btn" data-val="8">8GB+</button>
            <button class="pill-btn" data-val="12">12GB+</button>
            <button class="pill-btn" data-val="16">16GB+</button>
          </div>
        </div>

        <div class="filter-item">
          <label class="filter-label">Min Storage</label>
          <div class="pill-group" id="storagePills">
            <button class="pill-btn" data-val="128">128GB+</button>
            <button class="pill-btn" data-val="256">256GB+</button>
            <button class="pill-btn" data-val="512">512GB+</button>
          </div>
        </div>

        <div class="filter-item">
          <label class="filter-label">Min Battery Capacity</label>
          <div class="pill-group" id="batteryPills">
            <button class="pill-btn" data-val="4500">4500 mAh</button>
            <button class="pill-btn" data-val="5000">5000 mAh</button>
            <button class="pill-btn" data-val="6000">6000+ mAh</button>
          </div>
        </div>

        <div class="filter-item">
          <label class="filter-label">Must Excel At</label>
          <div class="pill-group" id="useCasePills">
            <button class="pill-btn" data-usecase="gaming">🎮 Gaming</button>
            <button class="pill-btn" data-usecase="camera">📸 Camera</button>
            <button class="pill-btn" data-usecase="battery">🔋 Battery</button>
            <button class="pill-btn" data-usecase="value">💎 Top VFM</button>
          </div>
        </div>
      </div>
      <button class="btn-card-specs" id="closeFilterMobile" style="width:100%; margin-top:16px;">Apply Filters</button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="search-section">
        <div class="search-bar-wrap">
          <input type="text" id="searchInput" placeholder="Search by name, processor, brand..." class="search-input">
          <button id="mobileFilterToggle" class="mobile-filter-btn">Filters ⚙️</button>
        </div>

        <!-- Top 10 / Top 20 Best Presets -->
        <div class="quick-top-pills" id="topFilterStrip">
          <button class="top-pill active" data-top="all">All Phones</button>
          <button class="top-pill highlight-gold" data-top="10">🏆 Top 10 Best</button>
          <button class="top-pill highlight-purple" data-top="20">🌟 Top 20 Best</button>
          <button class="top-pill" data-top="camera">📸 Best Camera</button>
          <button class="top-pill" data-top="gaming">⚡ Best Gaming</button>
          <button class="top-pill" data-top="budget">💰 Under ₹20k</button>
        </div>
      </div>

      <!-- Controls & Count Bar -->
      <div class="results-meta-bar">
        <div class="result-count">Found <b id="matchCount">0</b> smartphones matching criteria</div>
        <div class="sort-wrap">
          <label for="sortSelect" style="color:var(--text-muted); font-size:0.82rem; font-weight:700;">Sort:</label>
          <select id="sortSelect" class="sort-select">
            <option value="newest">Newest Launch (2026)</option>
            <option value="best">Highest Rated (Overall)</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="battery">Battery Capacity</option>
            <option value="ram">Highest RAM</option>
          </select>
        </div>
      </div>

      <div id="loadingView" class="state-card"><div class="spinner"></div>Loading Smartphones...</div>
      <div id="emptyView" class="state-card" style="display:none;">
        <h3>No Smartphone Matches All Requirements</h3>
        <p style="margin-top:6px;">Try adjusting sliders or clicking 'Reset All'.</p>
      </div>

      <div id="phoneGrid" class="phone-grid"></div>
    </main>
  </div>

  <!-- Specs Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-card">
      <div class="modal-top">
        <h2 id="modalTitle" class="modal-name">Phone Specs</h2>
        <button id="closeModal" class="btn-close">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Compare Dock -->
  <div class="compare-dock" id="compareDock">
    <span class="dock-text"><b id="dockCount">0</b> selected for comparison</span>
    <a href="compare.html" class="btn-compare-dock">Compare Now →</a>
  </div>

  <script src="smartphone-finder/js/utils.js"></script>
  <script src="smartphone-finder/js/data.js"></script>
  <script src="smartphone-finder/js/compare.js"></script>
  <script src="smartphone-finder/js/render.js"></script>
  <script src="smartphone-finder/js/app.js"></script>
</body>
</html>
