<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartFinder India - Best Smartphone Finder 2026</title>
  <link rel="stylesheet" href="smartphone-finder/css/base.css">
  <link rel="stylesheet" href="smartphone-finder/css/components.css">
  <link rel="stylesheet" href="smartphone-finder/css/responsive.css">
</head>
<body>
  <!-- Clean Glass Navbar -->
  <nav class="navbar">
    <div class="brand-wrap">
      <span class="brand-title">SmartFinder</span>
      <span class="brand-badge">India 2026 Edition</span>
    </div>
    <div class="nav-actions">
      <a href="compare.html" id="navCompareBtn" class="btn btn-compare">Compare (<span id="compareCount">0</span>)</a>
    </div>
  </nav>

  <div class="app-layout">
    <!-- Sidebar Filters -->
    <aside class="filter-sidebar" id="filterSidebar">
      <div class="sidebar-header">
        <h3>Smart Filters</h3>
        <button id="resetFilters" class="reset-link">Reset All</button>
      </div>

      <div class="filter-group-list">
        <div class="filter-item">
          <label class="filter-label">Max Budget: <b id="priceLabel" class="price-val">₹1,60,000</b></label>
          <input type="range" id="priceRange" min="5000" max="180000" step="5000" value="180000" class="range-slider">
        </div>

        <div class="filter-item">
          <label class="filter-label">Brand</label>
          <select id="brandSelect" class="form-select">
            <option value="">All Brands</option>
          </select>
        </div>

        <div class="filter-item">
          <label class="filter-label">Launch Year</label>
          <select id="yearSelect" class="form-select">
            <option value="">All Years (Up to 2026)</option>
            <option value="2026">2026 (Latest Launches)</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022 & older</option>
          </select>
        </div>

        <div class="filter-item">
          <label class="filter-label">Min RAM</label>
          <div class="pill-group" id="ramPills">
            <button class="pill-btn" data-val="6">6GB+</button>
            <button class="pill-btn" data-val="8">8GB+</button>
            <button class="pill-btn" data-val="12">12GB+</button>
            <button class="pill-btn" data-val="16">16GB+</button>
          </div>
        </div>

        <div class="filter-item">
          <label class="filter-label">Specific Priority</label>
          <div class="pill-group" id="useCasePills">
            <button class="pill-btn" data-usecase="gaming">🎮 Gaming</button>
            <button class="pill-btn" data-usecase="camera">📸 Camera</button>
            <button class="pill-btn" data-usecase="battery">🔋 Battery</button>
            <button class="pill-btn" data-usecase="value">💎 Value</button>
          </div>
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="closeFilterMobile">Apply Filters</button>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Search & Mobile Filter Bar -->
      <div class="search-section">
        <div class="search-bar-wrap">
          <input type="text" id="searchInput" placeholder="Search phones by brand, model, processor, 5G..." class="search-input">
          <button id="mobileFilterToggle" class="btn btn-outline mobile-filter-btn">Filters</button>
        </div>

        <!-- Top 10 / Top 20 Best Quick Filters -->
        <div class="quick-top-pills" id="topFilterStrip">
          <button class="top-pill active" data-top="all">All Devices</button>
          <button class="top-pill highlight-gold" data-top="10">🏆 Top 10 Best</button>
          <button class="top-pill highlight-purple" data-top="20">🌟 Top 20 Best</button>
          <button class="top-pill" data-top="camera">📸 Best Camera</button>
          <button class="top-pill" data-top="gaming">⚡ Best Gaming</button>
          <button class="top-pill" data-top="budget">💰 Under ₹20k</button>
        </div>
      </div>

      <!-- Controls & Count Bar -->
      <div class="results-meta-bar">
        <div class="result-count">Found <b id="matchCount">0</b> phones <span id="topFilterBadge"></span></div>
        <div class="sort-wrap">
          <label for="sortSelect" class="sort-label">Sort by:</label>
          <select id="sortSelect" class="sort-select">
            <option value="newest">Newest Launch (2026)</option>
            <option value="best">Highest Rated (Overall)</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="battery">Battery Capacity</option>
            <option value="ram">Highest RAM</option>
          </select>
        </div>
      </div>

      <!-- States & Grid -->
      <div id="loadingView" class="state-card"><div class="spinner"></div>Loading 3,000+ smartphones (Up to Oct 2026)...</div>
      <div id="emptyView" class="state-card" style="display:none;">
        <h3>No Smartphones Found</h3>
        <p>Try clearing your search query or picking a different filter.</p>
      </div>
      
      <div id="phoneGrid" class="phone-grid"></div>

      <!-- Pagination Controls -->
      <div id="paginationBar" class="pagination-container" style="display:none;">
        <div id="paginationInfo" class="page-info">Showing 1–24 phones</div>
        <div class="page-numbers" id="paginationControls"></div>
      </div>
    </main>
  </div>

  <!-- Specs Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-card">
      <div class="modal-top">
        <div>
          <h2 id="modalTitle" class="modal-name">Phone Specs</h2>
          <span id="modalQualityBadge"></span>
        </div>
        <button id="closeModal" class="btn-close">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Compare Dock -->
  <div class="compare-dock" id="compareDock">
    <span class="dock-text"><b id="dockCount">0</b> devices chosen</span>
    <a href="compare.html" class="btn btn-compare-dock">Compare Now →</a>
  </div>

  <script src="smartphone-finder/js/utils.js"></script>
  <script src="smartphone-finder/js/data.js"></script>
  <script src="smartphone-finder/js/compare.js"></script>
  <script src="smartphone-finder/js/filters.js"></script>
  <script src="smartphone-finder/js/search.js"></script>
  <script src="smartphone-finder/js/render.js"></script>
  <script src="smartphone-finder/js/app.js"></script>
</body>
</html>
